# Rebuilds the routes and stops for the live transit map (kylepace.dev/transit/) from every
# Washington GTFS feed (scripts/build-transit.ts). Weekly, whenever the feed list or the
# script changes, or on demand from the Actions tab. Commits only when the data changed;
# that push starts a Cloudflare deploy.
name: Transit map data

on:
  schedule:
    - cron: '23 11 * * 1'
  push:
    branches: [main]
    paths:
      - scripts/build-transit.ts
      - src/lib/transit-feeds.ts
      - .github/workflows/transit-data.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transit-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # Node 24 runs the TypeScript build script directly; no npm install needed.
      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # If the script itself is broken, stop before it touches the data.
      - name: Test the build script
        run: npm test

      - name: Build routes and stops
        run: node scripts/build-transit.ts

      - name: Commit changes
        run: |
          git add -A public/transit
          if git diff --cached --quiet; then
            echo "Transit data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update transit map routes and stops"
          # Another workflow may have pushed in the meantime.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 5
          done
          exit 1
