<!doctype html><html><head><meta charset="utf-8"><style>
/* Share card for kylepace.dev/transit/agencies (public/transit/share-agencies.png). The artwork on the right is the
   original card (design/base-agencies.png); this page covers its left side with the lab's own look
   (design/PLAN.md): the page's name on a Guide green sign, one line in ink, the address in
   green. Render at 1200x630 (share-card skill). */
@font-face{font-family:A;font-weight:400;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-400-normal.woff2")}
@font-face{font-family:A;font-weight:700;src:url("../node_modules/@fontsource/atkinson-hyperlegible-next/files/atkinson-hyperlegible-next-latin-700-normal.woff2")}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#141317 url("base-agencies.png") no-repeat;font-family:A}
/* Covers the old text; fades out over the artwork's edge so there's no seam. */
.cover{position:absolute;inset:0 auto 0 0;width:548px;background:linear-gradient(90deg,#141317 0,#141317 540px,rgb(20 19 23 / 0) 548px)}
.copy{position:absolute;left:80px;top:0;bottom:0;width:430px;display:flex;flex-direction:column;justify-content:center;gap:28px}
h1{margin:0;font-size:60px;font-weight:700;line-height:1.32;letter-spacing:-.015em;color:#fff}
h1 span{background:#0e6651;padding:2px 18px 6px;border-radius:6px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
p{margin:0;font-size:32px;line-height:1.3;color:#e4ebed}
.url{position:absolute;left:80px;bottom:72px;font-size:28px;font-weight:700;color:#6fd0ad}
</style></head><body>
<div class="cover"></div>
<div class="copy">
  <h1><span>Every transit agency in Washington</span></h1>
  <p>55 networks, each drawn from its own routes.</p>
</div>
<div class="url">kylepace.dev/transit/agencies</div>
</body></html>
